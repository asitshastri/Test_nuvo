[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defence-corpus"
version = "0.1.dev0"
description = "Defence/Security Corpus and NER Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nuvolink", email = "asitshastri@gmail.com"}]

# Core deps only. Heavy / platform-fragile libs live in extras and are added
# in the phase that needs them (P4 collect, P5 process).
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
collect = ["httpx>=0.25.0", "playwright>=1.40.0"]
process = ["trafilatura>=1.6.0", "pymupdf>=1.23.0", "datasketch>=1.6.0"]
# UNVERIFIED: fasttext often fails to build on Windows; GlotLID package name to confirm in P5.
langid = ["fasttext-wheel>=0.9.2"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "ruff>=0.5.0",
    "mypy>=1.6.0",
    "types-pyyaml>=6.0.0",
    "pandas-stubs>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --cov=src"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501"]
